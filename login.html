<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - PixelCraft</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">PixelCraft</a>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blogs</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
      <div class="user-actions">
        <a href="login.html">Iniciar Sesión</a>
        <a href="registro.html">Registrarse</a>
        <a href="carrito.html" class="btn-cart">Carrito (<span id="cart-count">0</span>)</a>
      </div>
    </div>
  </header>

  <main>
    <div class="form-container">
      <h2>Iniciar Sesión</h2>
      <form id="form-login">
        <div class="form-group">
          <label for="login-email">Correo Electrónico</label>
          <input type="email" id="login-email" placeholder="ejemplo@duoc.cl" required>
        </div>

        <div class="form-group">
          <label for="login-pass">Contraseña</label>
          <input type="password" id="login-pass" minlength="4" maxlength="10" required>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%;">Ingresar</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 PixelCraft Gaming</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/carrito.js"></script>
  <script>
    document.getElementById('form-login').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-pass').value;
      
      const errores = validarFormularioLogin(email, pass);

      if (errores.length > 0) {
        alert("Errores encontrados:\n- " + errores.join("\n- "));
      } else {
        alert("¡Inicio de sesión exitoso! Bienvenido a PixelCraft.");
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
