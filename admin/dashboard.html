<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - PixelCraft</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <h2 class="logo">Admin Panel</h2>
      <ul style="list-style: none; margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem;">
        <li><a href="dashboard.html" style="color: var(--accent-color);">Dashboard</a></li>
        <li><a href="productos.html">Mantenedor Productos</a></li>
        <li><a href="usuarios.html">Mantenedor Usuarios</a></li>
        <li><a href="../index.html" style="color: var(--danger-color);">Salir a la Tienda</a></li>
      </ul>
    </aside>

    <main class="admin-content">
      <h1>Bienvenido al Panel de Administración</h1>
      <p style="color: var(--text-muted); margin-top: 0.5rem;">Gestiona el catálogo de productos y usuarios del sistema.</p>
      
      <div style="display: flex; gap: 2rem; margin-top: 2rem;">
        <div class="form-container" style="margin: 0; width: 100%;">
          <h3>Total Productos</h3>
          <p style="font-size: 2rem; color: var(--accent-color); font-weight: bold;">3</p>
        </div>
        <div class="form-container" style="margin: 0; width: 100%;">
          <h3>Usuarios Registrados</h3>
          <p style="font-size: 2rem; color: var(--accent-color); font-weight: bold;">5</p>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
