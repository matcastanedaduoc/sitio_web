<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mantenedor Productos - Admin</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <h2 class="logo">Admin Panel</h2>
      <ul style="list-style: none; margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem;">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="productos.html" style="color: var(--accent-color);">Mantenedor Productos</a></li>
        <li><a href="usuarios.html">Mantenedor Usuarios</a></li>
        <li><a href="../index.html" style="color: var(--danger-color);">Salir a la Tienda</a></li>
      </ul>
    </aside>

    <main class="admin-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1>Mantenedor de Productos</h1>
        <a href="producto-form.html" class="btn-primary">+ Agregar Producto</a>
      </div>

      <table class="form-container" style="width: 100%; border-collapse: collapse; text-align: left;">
        <thead>
          <tr style="border-bottom: 2px solid var(--border-color); color: var(--accent-color);">
            <th style="padding: 1rem;">ID</th>
            <th style="padding: 1rem;">Imagen</th>
            <th style="padding: 1rem;">Código</th>
            <th style="padding: 1rem;">Nombre</th>
            <th style="padding: 1rem;">Precio</th>
            <th style="padding: 1rem;">Stock</th>
            <th style="padding: 1rem;">Acción</th>
          </tr>
        </thead>
        <tbody id="admin-tabla-productos">
          <!-- Carga Dinámica "En Vivo" -->
        </tbody>
      </table>
    </main>
  </div>

  <script src="../js/data.js"></script>
  <script>
    function renderTablaAdminProd() {
      const tbody = document.getElementById('admin-tabla-productos');
      const prods = obtenerProductosDB();

      if (!tbody) return;

      if (prods.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="padding: 1rem; text-align: center;">No hay productos registrados.</td></tr>`;
        return;
      }

      tbody.innerHTML = prods.map(p => `
        <tr style="border-bottom: 1px solid var(--border-color);">
          <td style="padding: 1rem;">#${p.id}</td>
          <td style="padding: 1rem;"><img src="${p.imagen}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 4px;"></td>
          <td style="padding: 1rem;">${p.codigo}</td>
          <td style="padding: 1rem; font-weight: bold;">${p.nombre}</td>
          <td style="padding: 1rem; color: var(--accent-color);">$${p.precio.toLocaleString('es-CL')}</td>
          <td style="padding: 1rem;">${p.stock} u.</td>
          <td style="padding: 1rem;">
            <button onclick="eliminarProductoAdmin(${p.id})" style="background: none; border: none; color: var(--danger-color); cursor: pointer; font-weight: bold;">Eliminar</button>
          </td>
        </tr>
      `).join('');
    }

    function eliminarProductoAdmin(id) {
      if (confirm("¿Seguro que deseas eliminar este producto?")) {
        let prods = obtenerProductosDB();
        prods = prods.filter(p => p.id !== id);
        localStorage.setItem('pixelcraft_productos', JSON.stringify(prods));
        renderTablaAdminProd();
      }
    }

    document.addEventListener('DOMContentLoaded', renderTablaAdminProd);

    window.addEventListener('storage', (e) => {
      if (e.key === 'pixelcraft_productos') {
        renderTablaAdminProd();
      }
    });
  </script>
</body>
</html>
