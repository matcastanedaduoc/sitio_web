<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mantenedor Usuarios - Admin</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <h2 class="logo">Admin Panel</h2>
      <ul style="list-style: none; margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem;">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="productos.html">Mantenedor Productos</a></li>
        <li><a href="usuarios.html" style="color: var(--accent-color);">Mantenedor Usuarios</a></li>
        <li><a href="../index.html" style="color: var(--danger-color);">Salir a la Tienda</a></li>
      </ul>
    </aside>

    <main class="admin-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1>Mantenedor de Usuarios Registrados</h1>
        <a href="usuario-form.html" class="btn-primary">+ Agregar Usuario</a>
      </div>

      <table class="form-container" style="width: 100%; border-collapse: collapse; text-align: left;">
        <thead>
          <tr style="border-bottom: 2px solid var(--border-color); color: var(--accent-color);">
            <th style="padding: 1rem;">ID</th>
            <th style="padding: 1rem;">Nombre</th>
            <th style="padding: 1rem;">RUN</th>
            <th style="padding: 1rem;">Correo</th>
            <th style="padding: 1rem;">Rol</th>
            <th style="padding: 1rem;">Acción</th>
          </tr>
        </thead>
        <tbody id="admin-tabla-usuarios">
        </tbody>
      </table>
    </main>
  </div>

  <script src="../js/data.js"></script>
  <script>
    function renderTablaAdminUsers() {
      const tbody = document.getElementById('admin-tabla-usuarios');
      const users = obtenerUsuariosDB();

      if (!tbody) return;

      tbody.innerHTML = users.map(u => `
        <tr style="border-bottom: 1px solid var(--border-color);">
          <td style="padding: 1rem;">#${u.id}</td>
          <td style="padding: 1rem; font-weight: bold;">${u.nombre}</td>
          <td style="padding: 1rem;">${u.run}</td>
          <td style="padding: 1rem;">${u.correo}</td>
          <td style="padding: 1rem; color: var(--accent-color);">${u.rol || 'Cliente'}</td>
          <td style="padding: 1rem;">
            <button onclick="eliminarUsuarioAdmin(${u.id})" style="background: none; border: none; color: var(--danger-color); cursor: pointer; font-weight: bold;">Eliminar</button>
          </td>
        </tr>
      `).join('');
    }

    function eliminarUsuarioAdmin(id) {
      if (confirm("¿Seguro que deseas eliminar este usuario?")) {
        let users = obtenerUsuariosDB();
        users = users.filter(u => u.id !== id);
        localStorage.setItem('pixelcraft_usuarios', JSON.stringify(users));
        renderTablaAdminUsers();
      }
    }

    document.addEventListener('DOMContentLoaded', renderTablaAdminUsers);

    window.addEventListener('storage', (e) => {
      if (e.key === 'pixelcraft_usuarios') {
        renderTablaAdminUsers();
      }
    });
  </script>
</body>
</html>
