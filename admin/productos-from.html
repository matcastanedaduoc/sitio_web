<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Producto - Admin</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <h2 class="logo">Admin Panel</h2>
      <ul style="list-style: none; margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem;">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="productos.html" style="color: var(--accent-color);">Mantenedor Productos</a></li>
        <li><a href="usuarios.html">Mantenedor Usuarios</a></li>
        <li><a href="../index.html" style="color: var(--danger-color);">Salir a la Tienda</a></li>
      </ul>
    </aside>

    <main class="admin-content">
      <h1>Crear / Editar Producto</h1>
      <div class="form-container" style="margin: 2rem 0; max-width: 600px;">
        <form id="form-nuevo-prod">
          <div class="form-group">
            <label for="p-codigo">Código</label>
            <input type="text" id="p-codigo" placeholder="MOUSE-02" required>
          </div>
          <div class="form-group">
            <label for="p-nombre">Nombre del Producto</label>
            <input type="text" id="p-nombre" placeholder="Mouse Gamer Inalámbrico" required>
          </div>
          <div class="form-group">
            <label for="p-precio">Precio ($ CLP)</label>
            <input type="number" id="p-precio" placeholder="35000" min="100" required>
          </div>
          <div class="form-group">
            <label for="p-stock">Stock Inicial</label>
            <input type="number" id="p-stock" value="10" min="1" required>
          </div>
          <div class="form-group">
            <label for="p-imagen">URL de la Imagen</label>
            <input type="url" id="p-imagen" placeholder="https://images.unsplash.com/..." required>
          </div>
          <div class="form-group">
            <label for="p-desc">Descripción</label>
            <textarea id="p-desc" rows="3" style="width: 100%; background: var(--bg-secondary); color: #fff; border: 1px solid var(--border-color); border-radius: 5px; padding: 0.8rem;" required></textarea>
          </div>
          <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <button type="submit" class="btn-primary">Guardar Producto</button>
            <a href="productos.html" class="btn-primary" style="background-color: var(--border-color); color: #fff;">Cancelar</a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="../js/data.js"></script>
  <script src="js/validaciones.js"></script>
  <script>
    document.getElementById('form-nuevo-prod').addEventListener('submit', (e) => {
      e.preventDefault();

      const prods = obtenerProductosDB();
      const nuevoProd = {
        id: prods.length > 0 ? Math.max(...prods.map(p => p.id)) + 1 : 1,
        codigo: document.getElementById('p-codigo').value,
        nombre: document.getElementById('p-nombre').value,
        precio: parseFloat(document.getElementById('p-precio').value),
        stock: parseInt(document.getElementById('p-stock').value),
        imagen: document.getElementById('p-imagen').value,
        descripcion: document.getElementById('p-desc').value,
        categoria: "General"
      };

      prods.push(nuevoProd);
      localStorage.setItem('pixelcraft_productos', JSON.stringify(prods));

      alert("¡Producto agregado exitosamente!");
      window.location.href = "productos.html";
    });
  </script>
</body>
</html>
